name: Deploy to GitHub Pages

# Builds dist/ and publishes it to the gh-pages branch. GitHub Pages is set to
# deploy from that branch, so no Pages settings change is needed for updates.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # brokervox.com DNS still points at Lovable. Publishing the CNAME now
      # would make GitHub redirect the github.io URL to a domain that is not
      # here yet. Delete this step once DNS points at GitHub Pages.
      - name: Hold the custom domain until DNS moves
        run: rm -f dist/CNAME
      - name: Publish dist/ to gh-pages
        run: |
          set -e
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7} to gh-pages"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
